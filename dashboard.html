<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedShield - Medical Device Monitor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 25px;
            text-align: center;
        }
        
        .header h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #666;
            font-size: 1.1em;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }
        
        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }
        
        .stat-card h3 {
            color: #666;
            font-size: 0.9em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        
        .stat-card .value {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
        }
        
        .stat-card.emergency .value {
            color: #e74c3c;
        }
        
        .stat-card.normal .value {
            color: #27ae60;
        }
        
        .content-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 25px;
        }
        
        .panel {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .panel h2 {
            color: #667eea;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .event-list {
            max-height: 600px;
            overflow-y: auto;
        }
        
        .event-item {
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            border-left: 4px solid #27ae60;
            background: #f8f9fa;
        }
        
        .event-item.emergency {
            border-left-color: #e74c3c;
            background: #ffe5e5;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .event-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .event-time {
            font-size: 0.85em;
            color: #666;
        }
        
        .event-status {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
        }
        
        .event-status.normal {
            background: #27ae60;
            color: white;
        }
        
        .event-status.emergency {
            background: #e74c3c;
            color: white;
        }
        
        .sensor-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 10px;
        }
        
        .sensor-value {
            background: white;
            padding: 8px;
            border-radius: 5px;
            font-size: 0.85em;
        }
        
        .sensor-label {
            color: #666;
            font-weight: bold;
        }
        
        .alert-panel {
            max-height: 600px;
            overflow-y: auto;
        }
        
        .alert-item {
            background: #ffe5e5;
            border: 2px solid #e74c3c;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        
        .alert-title {
            color: #e74c3c;
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 8px;
        }
        
        .alert-time {
            color: #666;
            font-size: 0.85em;
        }
        
        .no-alerts {
            text-align: center;
            color: #27ae60;
            padding: 40px;
            font-size: 1.2em;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        @media (max-width: 968px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏥 MedShield</h1>
            <p>Real-time Medical Device Monitoring System</p>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Packets</h3>
                <div class="value" id="totalPackets">0</div>
            </div>
            <div class="stat-card normal">
                <h3>Normal Events</h3>
                <div class="value" id="normalCount">0</div>
            </div>
            <div class="stat-card emergency">
                <h3>Emergency Alerts</h3>
                <div class="value" id="emergencyCount">0</div>
            </div>
            <div class="stat-card">
                <h3>Avg Anomaly Score</h3>
                <div class="value" id="avgScore">0.000</div>
            </div>
        </div>
        
        <div class="content-grid">
            <div class="panel">
                <h2>📊 Recent Events</h2>
                <div class="event-list" id="eventList">
                    <div class="loading">Loading events...</div>
                </div>
            </div>
            
            <div class="panel">
                <h2>🚨 Emergency Alerts</h2>
                <div class="alert-panel" id="alertPanel">
                    <div class="no-alerts">No emergencies detected</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';
        
        function updateStats() {
            fetch(`${API_URL}/stats`)
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        document.getElementById('totalPackets').textContent = data.total_packets;
                        document.getElementById('normalCount').textContent = data.normal_count;
                        document.getElementById('emergencyCount').textContent = data.emergency_count;
                        document.getElementById('avgScore').textContent = data.avg_anomaly_score.toFixed(6);
                    }
                })
                .catch(error => console.error('Error fetching stats:', error));
        }
        
        function updateEvents() {
            fetch(`${API_URL}/latest?limit=20`)
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success' && data.data.length > 0) {
                        const eventList = document.getElementById('eventList');
                        eventList.innerHTML = '';
                        
                        const alertPanel = document.getElementById('alertPanel');
                        const emergencies = data.data.filter(item => item.is_emergency === 1);
                        
                        if (emergencies.length > 0) {
                            alertPanel.innerHTML = '';
                            emergencies.slice(0, 10).forEach(item => {
                                alertPanel.innerHTML += createAlertHTML(item);
                            });
                        } else {
                            alertPanel.innerHTML = '<div class="no-alerts">No emergencies detected</div>';
                        }
                        
                        data.data.forEach(item => {
                            eventList.innerHTML += createEventHTML(item);
                        });
                    }
                })
                .catch(error => console.error('Error fetching events:', error));
        }
        
        function createEventHTML(item) {
            const isEmergency = item.is_emergency === 1;
            const statusClass = isEmergency ? 'emergency' : 'normal';
            const statusText = isEmergency ? 'EMERGENCY' : 'NORMAL';
            const time = new Date(item.created_at).toLocaleString();
            
            return `
                <div class="event-item ${statusClass}">
                    <div class="event-header">
                        <span class="event-time">${time}</span>
                        <span class="event-status ${statusClass}">${statusText}</span>
                    </div>
                    <div><strong>Device:</strong> ${item.device_id} | <strong>Score:</strong> ${item.anomaly_score.toFixed(6)}</div>
                    <div class="sensor-grid">
                        <div class="sensor-value"><span class="sensor-label">Temp:</span> ${item.temperature.toFixed(2)}°C</div>
                        <div class="sensor-value"><span class="sensor-label">Humidity:</span> ${item.humidity.toFixed(2)}%</div>
                        <div class="sensor-value"><span class="sensor-label">Accel:</span> (${item.accel_x.toFixed(2)}, ${item.accel_y.toFixed(2)}, ${item.accel_z.toFixed(2)})</div>
                        <div class="sensor-value"><span class="sensor-label">Gyro:</span> (${item.gyro_x.toFixed(2)}, ${item.gyro_y.toFixed(2)}, ${item.gyro_z.toFixed(2)})</div>
</div>
</div>
`;
}

function createAlertHTML(item) {
        const time = new Date(item.created_at).toLocaleString();
        return `
            <div class="alert-item">
                <div class="alert-title">⚠️ Emergency Detected</div>
                <div><strong>Device:</strong> ${item.device_id}</div>
                <div><strong>Anomaly Score:</strong> ${item.anomaly_score.toFixed(6)}</div>
                <div class="alert-time">${time}</div>
            </div>
        `;
    }
    
    function refreshDashboard() {
        updateStats();
        updateEvents();
    }
    
    // Initial load
    refreshDashboard();
    
    // Auto-refresh every 1.5 seconds
    setInterval(refreshDashboard, 1500);
</script>

</body>
</html>
````
